services:

  mysql:

    image: mysql:8.4

    container_name: catalog-mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: Root@Catalog2026

      MYSQL_DATABASE: catalog_db

      MYSQL_USER: catalog_user

      MYSQL_PASSWORD: Catalog@Dev2026

    ports:

      - "3307:3306"

    volumes:

      - mysql-data:/var/lib/mysql

    healthcheck:

      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]

      interval: 10s

      timeout: 5s

      retries: 10

volumes:

  mysql-data: